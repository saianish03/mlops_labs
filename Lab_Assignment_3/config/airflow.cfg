# Only the settings we change. Airflow uses its defaults for everything else.
# Passwords, database and secrets are set in docker-compose.yaml.

[core]
executor = LocalExecutor
load_examples = False
dags_are_paused_at_creation = True
default_timezone = utc
parallelism = 8
max_active_tasks_per_dag = 4
max_active_runs_per_dag = 1
